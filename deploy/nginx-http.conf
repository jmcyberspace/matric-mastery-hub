# Initial HTTP-only host. Replace learn.example.org, then use Certbot.
# Place nginx-limits.conf in /etc/nginx/conf.d/ first.
server {
    listen 80;
    listen [::]:80;
    server_name learn.example.org;
    server_tokens off;
    client_max_body_size 96k;
    client_body_timeout 10s;
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
        proxy_connect_timeout 5s;
        limit_req zone=matric_api burst=80 nodelay;
    }
    location ~ ^/api/auth/(login|forgot-password|reset-password|accept-invitation)$ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
        limit_req zone=matric_auth burst=20 nodelay;
    }
}
